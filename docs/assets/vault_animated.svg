<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="vaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070A"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>

    <linearGradient id="goldDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="50%" stop-color="#00C7BE"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>

    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .vt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #FFFFFF; }
      .vt-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #86868B; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
      .vt-mono { font-family: "JetBrains Mono", monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="856" height="256" rx="24" fill="url(#vaultBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- ================= LEFT: ROTATING DIGITAL VAULT DIAL ================= -->
  <g transform="translate(130, 130)">
    <!-- Outer Vault Ring -->
    <circle cx="0" cy="0" r="95" stroke="#33333E" stroke-width="3" fill="#141418"/>
    
    <!-- Rotating Gear Teeth Dial -->
    <g>
      <circle cx="0" cy="0" r="80" stroke="#0071E3" stroke-width="2" stroke-dasharray="10 8" fill="none" opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="16s" repeatCount="indefinite"/>
    </g>

    <!-- Counter-Rotating Cryptographic Hash Dial -->
    <g>
      <circle cx="0" cy="0" r="64" stroke="#30D158" stroke-width="1.5" stroke-dasharray="6 12" fill="none" opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- Center Heavy Vault Core Lock -->
    <circle cx="0" cy="0" r="44" fill="#1C1C22" stroke="url(#goldDial)" stroke-width="2.5" filter="url(#vGlow)"/>

    <!-- Keyhole Icon -->
    <path d="M 0 -12 C 7 -12 12 -7 12 0 C 12 4 10 7 7 9 L 9 20 L -9 20 L -7 9 C -10 7 -12 4 -12 0 C -12 -7 -7 -12 0 -12 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="-3" r="4" fill="#141418"/>

    <!-- Concentric Green Verification Pulse -->
    <circle cx="0" cy="0" r="44" stroke="#30D158" stroke-width="1.5" fill="none" opacity="0.8">
      <animate attributeName="r" values="44;92;44" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= RIGHT: AES-256-GCM ZERO-KNOWLEDGE STREAM ================= -->
  <g transform="translate(280, 32)">
    <text x="0" y="18" class="vt-title">AES-256-GCM Zero-Knowledge Stream</text>
    <text x="0" y="34" class="vt-sub">Client-Side Authenticated Ciphertext Transformation</text>

    <!-- Visual 3-Stage Pipeline Box -->
    <g transform="translate(0, 52)">
      <!-- Stage 1: Plaintext on Device -->
      <g>
        <rect x="0" y="0" width="160" height="120" rx="14" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="14" y="24" class="vt-sub" fill="#64D2FF">1. USER BROWSER</text>
        <text x="14" y="46" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Cleartext Record</text>
        <text x="14" y="66" class="vt-mono" fill="#86868B">Passports, IDs, Keys</text>
        
        <rect x="14" y="82" width="132" height="24" rx="6" fill="#0071E3" fill-opacity="0.12"/>
        <text x="22" y="98" class="vt-mono" fill="#5AC8FA" font-size="10">Plaintext in RAM</text>
      </g>

      <!-- Connecting Arrow 1 with Animated Stream -->
      <g transform="translate(160, 55)">
        <line x1="10" y1="5" x2="35" y2="5" stroke="#33333E" stroke-width="2"/>
        <circle cx="10" cy="5" r="3" fill="#0071E3">
          <animate attributeName="cx" values="10;35;10" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Stage 2: WebCrypto AES-GCM -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="160" height="120" rx="14" fill="#16161A" stroke="#30D158" stroke-opacity="0.4" stroke-width="1"/>
        <text x="14" y="24" class="vt-sub" fill="#30D158">2. WEBCRYPTO API</text>
        <text x="14" y="46" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Authenticated AES</text>
        <text x="14" y="66" class="vt-mono" fill="#86868B">96-bit Random IV</text>
        
        <rect x="14" y="82" width="132" height="24" rx="6" fill="#30D158" fill-opacity="0.12"/>
        <text x="20" y="98" class="vt-mono" fill="#30D158" font-size="10">128-bit Auth Tag</text>
      </g>

      <!-- Connecting Arrow 2 with Animated Stream -->
      <g transform="translate(365, 55)">
        <line x1="10" y1="5" x2="35" y2="5" stroke="#33333E" stroke-width="2"/>
        <circle cx="10" cy="5" r="3" fill="#30D158">
          <animate attributeName="cx" values="10;35;10" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Stage 3: Server Blind Ciphertext -->
      <g transform="translate(410, 0)">
        <rect x="0" y="0" width="150" height="120" rx="14" fill="#16161A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="14" y="24" class="vt-sub" fill="#FF9F0A">3. BLIND SERVER</text>
        <text x="14" y="46" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">PostgreSQL DB</text>
        <text x="14" y="66" class="vt-mono" fill="#86868B">Zero Plaintext</text>
        
        <rect x="14" y="82" width="122" height="24" rx="6" fill="#FF9F0A" fill-opacity="0.12"/>
        <text x="20" y="98" class="vt-mono" fill="#FF9F0A" font-size="10">Encrypted Only</text>
      </g>
    </g>
  </g>
</svg>
