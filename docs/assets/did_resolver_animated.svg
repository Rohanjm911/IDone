<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="didBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#101017"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="didScanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,113,227,0)"/>
      <stop offset="50%" stop-color="rgba(100,210,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(0,113,227,0)"/>
    </linearGradient>

    <linearGradient id="keyDialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="50%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#AF52DE"/>
    </linearGradient>

    <filter id="didGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .did-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #FFFFFF; }
      .did-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #86868B; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
      .did-mono { font-family: "JetBrains Mono", monospace; font-size: 10.5px; fill: #64D2FF; }
      .did-json-key { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #5AC8FA; }
      .did-json-val { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #30D158; }
      .did-badge-txt { font-family: -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="856" height="256" rx="24" fill="url(#didBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- ================= LEFT: ED25519 KEYPAIR & DID HASH GENERATOR ================= -->
  <g transform="translate(130, 130)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="92" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>

    <!-- Rotating Cryptographic Assertion Ring -->
    <g>
      <circle cx="0" cy="0" r="80" stroke="#0071E3" stroke-width="2" stroke-dasharray="12 10" fill="none" opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Counter-Rotating Multihash Ring -->
    <g>
      <circle cx="0" cy="0" r="62" stroke="#AF52DE" stroke-width="1.5" stroke-dasharray="8 8" fill="none" opacity="0.7"/>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- Center Biometric Shield Core -->
    <circle cx="0" cy="0" r="42" fill="#14141A" stroke="url(#keyDialGrad)" stroke-width="2" filter="url(#didGlow)"/>
    
    <!-- Shield Icon & Keyhole -->
    <path d="M 0 -14 L 14 -7 C 14 7 8 15 0 18 C -8 15 -14 7 -14 -7 Z" fill="#0071E3" fill-opacity="0.3" stroke="#5AC8FA" stroke-width="1.5"/>
    <circle cx="0" cy="-2" r="3" fill="#FFFFFF"/>
    <path d="M -1.5 0 L 1.5 0 L 2 7 L -2 7 Z" fill="#FFFFFF"/>

    <!-- Pulsing Keypair Emission Ring -->
    <circle cx="0" cy="0" r="42" stroke="#5AC8FA" stroke-width="1.5" fill="none" opacity="0.8">
      <animate attributeName="r" values="42;88;42" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting Keypair Satellite Badge -->
    <g>
      <g transform="translate(68, -48)">
        <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#1A1A24" stroke="#5AC8FA" stroke-width="1"/>
        <text x="0" y="3" text-anchor="middle" fill="#5AC8FA" class="did-badge-txt">KEY #2</text>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ================= RIGHT: LIVE W3C JSON-LD DID RESOLVER ================= -->
  <g transform="translate(280, 24)">
    <!-- Header Strip -->
    <text x="0" y="16" class="did-title">W3C Decentralized Identifier Resolution</text>
    <text x="0" y="32" class="did-sub">Deterministic Multihash Resolution & Side-Channel Resistant Key Rotation</text>

    <!-- Active DID Pill Header -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="540" height="34" rx="10" fill="#121218" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#30D158">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="21" class="did-mono">did:idone:0558b3f4fd6234fc3e3f78a29b</text>

      <!-- Status Badge -->
      <rect x="420" y="7" width="108" height="20" rx="10" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-opacity="0.4"/>
      <text x="474" y="21" text-anchor="middle" fill="#30D158" class="did-badge-txt">RESOLVED &amp; ACTIVE</text>
    </g>

    <!-- Live JSON-LD Document Window -->
    <g transform="translate(0, 88)">
      <!-- Terminal Frame -->
      <rect x="0" y="0" width="540" height="128" rx="12" fill="#0C0C12" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <!-- Scanning Laser Beam -->
      <rect x="2" y="0" width="536" height="24" fill="url(#didScanGrad)">
        <animate attributeName="y" values="2;102;2" dur="4s" repeatCount="indefinite"/>
      </rect>

      <!-- Code Lines -->
      <g transform="translate(16, 20)">
        <text x="0" y="0" class="did-json-key">"@context": <tspan class="did-json-val">"https://www.w3.org/ns/did/v1"</tspan>,</text>
        <text x="0" y="18" class="did-json-key">"id": <tspan class="did-json-val">"did:idone:0558b3f4fd6234fc3e3f78a29b"</tspan>,</text>
        <text x="0" y="36" class="did-json-key">"verificationMethod": [{</text>
        <text x="18" y="52" class="did-json-key">"id": <tspan class="did-json-val">"...#key-2"</tspan>, <tspan class="did-json-key">"type": </tspan><tspan class="did-json-val">"Ed25519VerificationKey2020"</tspan></text>
        <text x="18" y="68" class="did-json-key">"publicKeyHex": <tspan class="did-json-val">"7b8c2e1194fa89de902bb314ef82110c..."</tspan></text>
        <text x="0" y="84" class="did-json-key">}], "assertionMethod": [<tspan class="did-json-val">"...#key-2"</tspan>]</text>
      </g>

      <!-- Bottom Mini Telemetry Badges -->
      <g transform="translate(16, 102)">
        <rect x="0" y="0" width="112" height="18" rx="4" fill="#0071E3" fill-opacity="0.15"/>
        <text x="56" y="12" text-anchor="middle" fill="#5AC8FA" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">Ed25519 (RFC 8032)</text>

        <rect x="122" y="0" width="108" height="18" rx="4" fill="#AF52DE" fill-opacity="0.15"/>
        <text x="176" y="12" text-anchor="middle" fill="#BF5AF2" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">W3C DID Core 1.0</text>

        <rect x="240" y="0" width="124" height="18" rx="4" fill="#30D158" fill-opacity="0.15"/>
        <text x="302" y="12" text-anchor="middle" fill="#30D158" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">IdentityRegistry.sol</text>

        <!-- Dynamic Rotation Counter -->
        <rect x="374" y="0" width="134" height="18" rx="4" fill="#FF9F0A" fill-opacity="0.15"/>
        <text x="441" y="12" text-anchor="middle" fill="#FF9F0A" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">Rotation Window: Valid</text>
      </g>
    </g>
  </g>
</svg>
