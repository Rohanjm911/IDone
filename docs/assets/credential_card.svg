<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F14"/>
      <stop offset="50%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#0A0A0E"/>
    </linearGradient>

    <!-- Holographic Iridescent Shimmer Sweep -->
    <linearGradient id="holoShine" x1="-100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="30%" stop-color="rgba(0,113,227,0.15)"/>
      <stop offset="50%" stop-color="rgba(175,82,222,0.25)"/>
      <stop offset="70%" stop-color="rgba(48,209,88,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animate attributeName="x1" values="-100%;200%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;300%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Gold NFC Microchip Gradient -->
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="40%" stop-color="#FF9F0A"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .sf-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #FFFFFF; letter-spacing: -0.01em; }
      .sf-meta { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #86868B; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
      .sf-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; fill: #F5F5F7; font-weight: 600; }
      .mono-chip { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #64D2FF; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="856" height="276" rx="24" fill="#060608" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ================= THE APPLE WALLET PASS CARD ================= -->
  <g transform="translate(40, 20)">
    <!-- Base Card Body -->
    <rect x="0" y="0" width="440" height="240" rx="20" fill="url(#cardBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Holographic Iridescent Foil Overlay -->
    <rect x="0" y="0" width="440" height="240" rx="20" fill="url(#holoShine)" pointer-events="none"/>

    <!-- Card Header Strip -->
    <g transform="translate(24, 22)">
      <!-- Issuer Crest / Mark -->
      <circle cx="16" cy="16" r="16" fill="#0071E3" fill-opacity="0.2"/>
      <path d="M 16 8 L 24 12 C 24 20 20 24 16 26 C 12 24 8 20 8 12 Z" fill="#0071E3" stroke="#5AC8FA" stroke-width="1.5"/>

      <!-- Issuer Title -->
      <text x="42" y="14" class="sf-title" font-size="14">MIT Cryptography Lab</text>
      <text x="42" y="28" class="sf-meta" font-size="9.5">W3C Accredited Authority • did:idone:mit-root</text>

      <!-- Top Right: NFC Microchip with Radiating Waves -->
      <g transform="translate(340, 2)">
        <!-- NFC Base Chip Plate -->
        <rect x="0" y="0" width="42" height="30" rx="6" fill="url(#goldChip)" stroke="#FDE047" stroke-width="1"/>
        <!-- Contact Pads Divisions -->
        <line x1="14" y1="0" x2="14" y2="30" stroke="#78350F" stroke-width="1" opacity="0.6"/>
        <line x1="28" y1="0" x2="28" y2="30" stroke="#78350F" stroke-width="1" opacity="0.6"/>
        <line x1="0" y1="15" x2="42" y2="15" stroke="#78350F" stroke-width="1" opacity="0.6"/>

        <!-- Radiating Contactless Radio Waves -->
        <g transform="translate(52, 15)">
          <path d="M 2 -8 A 12 12 0 0 1 2 8" stroke="#30D158" stroke-width="1.5" fill="none" opacity="0.8">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
          </path>
          <path d="M 6 -12 A 18 18 0 0 1 6 12" stroke="#30D158" stroke-width="1.5" fill="none" opacity="0.5">
            <animate attributeName="opacity" values="0.1;0.8;0.1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
          </path>
          <path d="M 10 -16 A 24 24 0 0 1 10 16" stroke="#30D158" stroke-width="1.5" fill="none" opacity="0.3">
            <animate attributeName="opacity" values="0;0.6;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>

    <!-- Card Content Body -->
    <g transform="translate(24, 82)">
      <!-- Credential Title -->
      <text x="0" y="16" class="sf-title" font-size="18">Doctorate of Sovereign Cryptography</text>
      <text x="0" y="34" class="sf-meta">W3C Verifiable Credential v1.1 • RFC 8785 JCS</text>

      <!-- Two-Column Attributes -->
      <g transform="translate(0, 52)">
        <g>
          <text x="0" y="0" class="sf-meta">Subject Holder</text>
          <text x="0" y="18" class="sf-value">Rohan J. Mukherjee</text>
        </g>
        <g transform="translate(180, 0)">
          <text x="0" y="0" class="sf-meta">Security Clearance</text>
          <text x="0" y="18" class="sf-value" fill="#30D158">Level 5 (Top Secret)</text>
        </g>
      </g>

      <!-- Bottom Status Pill & Signature -->
      <g transform="translate(0, 98)">
        <!-- Verified Status Pill -->
        <rect x="0" y="0" width="138" height="24" rx="12" fill="#30D158" fill-opacity="0.12" stroke="#30D158" stroke-opacity="0.4"/>
        <circle cx="12" cy="12" r="3.5" fill="#30D158">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="24" y="16" fill="#30D158" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">ED25519 VERIFIED</text>

        <!-- On-Chain Hash -->
        <text x="155" y="16" class="mono-chip">0x89f2b...7c1a (EVM Block #219034)</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: SPECIFICATIONS & VERIFICATION BREAKDOWN ================= -->
  <g transform="translate(520, 40)">
    <!-- Checklist Items with Animated Glowing Pulsing Dots -->
    <g transform="translate(0, 5)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="8" fill="#0071E3" fill-opacity="0.15"/>
        <circle cx="8" cy="8" r="3.5" fill="#0071E3"/>
        <text x="26" y="12" class="sf-value" font-size="13">Holographic Security Sheen</text>
        <text x="26" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#86868B">Simulates physical anti-counterfeit diffraction foil</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 50)">
        <circle cx="8" cy="8" r="8" fill="#30D158" fill-opacity="0.15"/>
        <circle cx="8" cy="8" r="3.5" fill="#30D158">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="12" class="sf-value" font-size="13">Contactless NFC Simulation</text>
        <text x="26" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#86868B">Visual proximity verification emission pulses</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 100)">
        <circle cx="8" cy="8" r="8" fill="#AF52DE" fill-opacity="0.15"/>
        <circle cx="8" cy="8" r="3.5" fill="#AF52DE"/>
        <text x="26" y="12" class="sf-value" font-size="13">Selective Disclosure Protocol</text>
        <text x="26" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#86868B">Zero-knowledge proof presentation without SSN/DOB</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 150)">
        <circle cx="8" cy="8" r="8" fill="#FF9F0A" fill-opacity="0.15"/>
        <circle cx="8" cy="8" r="3.5" fill="#FF9F0A"/>
        <text x="26" y="12" class="sf-value" font-size="13">Immutable EVM Ledger Anchor</text>
        <text x="26" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#86868B">On-chain revocation registry check in real-time</text>
      </g>
    </g>
  </g>
</svg>
