<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080A"/>
      <stop offset="50%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#0071E3;#AF52DE;#30D158;#0071E3" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#AF52DE" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#AF52DE;#30D158;#0071E3;#AF52DE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00C7BE" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00C7BE;#0071E3;#AF52DE;#00C7BE" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#5AC8FA"/>
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AF52DE"/>
      <stop offset="100%" stop-color="#FF2D55"/>
    </linearGradient>

    <!-- Scan Line Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5AC8FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.03em; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; }
      .text-tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; letter-spacing: -0.01em; font-style: italic; }
      .text-badge { font-family: "JetBrains Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="856" height="246" rx="24" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="856" height="246" rx="24" stroke="url(#borderGrad)" stroke-width="2" fill="none"/>

  <!-- Ambient Ambient Glow Orbs -->
  <circle cx="120" cy="125" r="90" fill="#0071E3" opacity="0.12" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="80" r="110" fill="#AF52DE" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.14;0.05" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative Grid Dots -->
  <g opacity="0.15">
    <circle cx="340" cy="40" r="1.5" fill="#FFFFFF"/>
    <circle cx="380" cy="40" r="1.5" fill="#FFFFFF"/>
    <circle cx="420" cy="40" r="1.5" fill="#FFFFFF"/>
    <circle cx="460" cy="40" r="1.5" fill="#FFFFFF"/>
    <circle cx="500" cy="40" r="1.5" fill="#FFFFFF"/>
    <circle cx="540" cy="40" r="1.5" fill="#FFFFFF"/>
    <circle cx="340" cy="65" r="1.5" fill="#FFFFFF"/>
    <circle cx="380" cy="65" r="1.5" fill="#FFFFFF"/>
    <circle cx="420" cy="65" r="1.5" fill="#FFFFFF"/>
    <circle cx="460" cy="65" r="1.5" fill="#FFFFFF"/>
    <circle cx="500" cy="65" r="1.5" fill="#FFFFFF"/>
    <circle cx="540" cy="65" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- ================= LEFT: ANIMATED BIOMETRIC SHIELD ================= -->
  <g transform="translate(45, 35)">
    <!-- Rotating Outer Radar Ring -->
    <circle cx="90" cy="90" r="76" stroke="#0071E3" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Counter-rotating Inner Precision Ring -->
    <circle cx="90" cy="90" r="64" stroke="#AF52DE" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.35" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 90 90" to="0 90 90" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- Concentric Pulse Ring -->
    <circle cx="90" cy="90" r="50" stroke="#00C7BE" stroke-width="1" opacity="0.6" fill="none">
      <animate attributeName="r" values="46;78;46" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Apple Squircle Hexagon Base Shield -->
    <path d="M 90 28 L 138 48 C 138 96 116 134 90 148 C 64 134 42 96 42 48 Z" 
          fill="#16161A" stroke="url(#blueCyan)" stroke-width="2.5" filter="url(#softGlow)"/>

    <!-- Biometric Keyhole Symbol -->
    <circle cx="90" cy="74" r="13" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 85 82 L 95 82 L 98 108 L 82 108 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Animated Cyber Laser Scanning Beam -->
    <g>
      <rect x="42" y="32" width="96" height="6" fill="url(#scanGrad)">
        <animate attributeName="y" values="30;138;30" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <line x1="44" y1="35" x2="136" y2="35" stroke="#5AC8FA" stroke-width="2" filter="url(#glow)">
        <animate attributeName="y1" values="33;141;33" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="33;141;33" dur="2.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Verification Check Pulse -->
    <circle cx="132" cy="44" r="10" fill="#30D158" filter="url(#softGlow)"/>
    <path d="M 128 44 L 131 47 L 137 41" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= RIGHT: BRANDING & SPECIFICATIONS ================= -->
  <g transform="translate(250, 45)">
    <!-- Subtitle Category Capsule -->
    <g>
      <rect x="0" y="0" width="225" height="24" rx="12" fill="#0071E3" fill-opacity="0.12" stroke="#0071E3" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#30D158">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16" fill="#5AC8FA" class="text-sub" font-size="10">DECENTRALIZED IDENTITY VAULT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="65" fill="#FFFFFF" class="text-title">
      IDone<tspan fill="#0071E3">.</tspan>
      <tspan fill="#A1A1A6" font-size="19" font-weight="400"> — Apple-Grade Sovereignty</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="95" fill="#86868B" class="text-tagline">
      "Your Identity. Your Credentials. Your Control."
    </text>

    <!-- Live Telemetry Badges Strip -->
    <g transform="translate(0, 120)">
      <!-- Badge 1: W3C VC Model -->
      <g>
        <rect x="0" y="0" width="130" height="32" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#0071E3"/>
        <text x="28" y="20" fill="#F5F5F7" class="text-badge">W3C DID / VC</text>
      </g>

      <!-- Badge 2: AES-256-GCM -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="135" height="32" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#30D158">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="28" y="20" fill="#F5F5F7" class="text-badge">AES-256-GCM</text>
      </g>

      <!-- Badge 3: Ed25519 -->
      <g transform="translate(285, 0)">
        <rect x="0" y="0" width="125" height="32" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#AF52DE"/>
        <text x="28" y="20" fill="#F5F5F7" class="text-badge">Ed25519 JCS</text>
      </g>

      <!-- Badge 4: EVM On-Chain -->
      <g transform="translate(420, 0)">
        <rect x="0" y="0" width="145" height="32" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#FF9F0A"/>
        <text x="28" y="20" fill="#F5F5F7" class="text-badge">EVM Smart Anchor</text>
      </g>
    </g>
  </g>

  <!-- Live Pulse Status Dot in Corner -->
  <g transform="translate(815, 25)">
    <circle cx="0" cy="0" r="5" fill="#30D158">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#30D158"/>
  </g>
</svg>
