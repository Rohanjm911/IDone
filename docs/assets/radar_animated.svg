<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>

    <!-- Radar Sweep Cone Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#30D158" stop-opacity="0"/>
    </linearGradient>

    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .hud-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #FFFFFF; }
      .hud-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #86868B; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
      .hud-score { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 38px; fill: #30D158; letter-spacing: -0.03em; }
      .hud-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #F5F5F7; font-weight: 500; }
      .hud-mono { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="856" height="276" rx="24" fill="url(#radarBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- ================= LEFT: 360-DEGREE ROTATING RADAR SWEEP ================= -->
  <g transform="translate(140, 140)">
    <!-- Radar Outer Housing Ring -->
    <circle cx="0" cy="0" r="105" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="85" stroke="#30D158" stroke-width="1" stroke-opacity="0.2" fill="none"/>
    <circle cx="0" cy="0" r="60" stroke="#30D158" stroke-width="1" stroke-opacity="0.25" fill="none"/>
    <circle cx="0" cy="0" r="35" stroke="#30D158" stroke-width="1" stroke-opacity="0.3" fill="none"/>

    <!-- Crosshair Axes -->
    <line x1="-105" y1="0" x2="105" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Rotating Radar Sweep Wedge -->
    <g>
      <path d="M 0 0 L 74 -74 A 105 105 0 0 1 105 0 Z" fill="url(#sweepGrad)"/>
      <line x1="0" y1="0" x2="74" y2="-74" stroke="#30D158" stroke-width="2" filter="url(#radarGlow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Radar Target Blips (Detected Cryptographic Credentials) -->
    <!-- Blip 1: Identity Key -->
    <g transform="translate(45, -35)">
      <circle cx="0" cy="0" r="4" fill="#5AC8FA">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="8" stroke="#5AC8FA" stroke-width="1" fill="none" opacity="0.6">
        <animate attributeName="r" values="4;12;4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Blip 2: Active VC -->
    <g transform="translate(-50, 40)">
      <circle cx="0" cy="0" r="4" fill="#30D158">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Blip 3: Encrypted Item -->
    <g transform="translate(20, 65)">
      <circle cx="0" cy="0" r="4" fill="#BF5AF2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Center Radar Anchor -->
    <circle cx="0" cy="0" r="4" fill="#30D158"/>
    <circle cx="0" cy="0" r="8" stroke="#30D158" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- ================= CENTER: SCORE GAUGE ================= -->
  <g transform="translate(300, 45)">
    <!-- Circular Score Indicator -->
    <g transform="translate(60, 95)">
      <!-- Background Track -->
      <circle cx="0" cy="0" r="54" stroke="rgba(255,255,255,0.06)" stroke-width="8" fill="none"/>
      <!-- Active Green Arc -->
      <circle cx="0" cy="0" r="54" stroke="#30D158" stroke-width="8" stroke-linecap="round" 
              stroke-dasharray="339" stroke-dashoffset="15" fill="none" filter="url(#radarGlow)"/>
      <text x="0" y="10" text-anchor="middle" class="hud-score">100</text>
      <text x="0" y="26" text-anchor="middle" class="hud-sub" fill="#30D158">OPTIMAL</text>
    </g>

    <text x="60" y="175" text-anchor="middle" class="hud-sub">SECURITY HEALTH SCORE</text>
  </g>

  <!-- ================= RIGHT: TELEMETRY VECTORS HUD ================= -->
  <g transform="translate(460, 32)">
    <text x="0" y="18" class="hud-title">Real-Time Threat &amp; Integrity Vectors</text>
    <text x="0" y="34" class="hud-sub">Automated Algorithmic Health Evaluation</text>

    <!-- Vector 1: Asymmetric DID Key -->
    <g transform="translate(0, 52)">
      <div class="flex justify-between">
        <text x="0" y="0" class="hud-bar-label">Identity Keypair (Ed25519)</text>
        <text x="350" y="0" text-anchor="end" class="hud-mono" fill="#30D158">ACTIVE / ROTATED</text>
      </div>
      <!-- Progress Bar Track -->
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#1C1C1E"/>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#30D158"/>
    </g>

    <!-- Vector 2: AES-256-GCM Coverage -->
    <g transform="translate(0, 92)">
      <text x="0" y="0" class="hud-bar-label">Zero-Knowledge Locker Coverage</text>
      <text x="350" y="0" text-anchor="end" class="hud-mono" fill="#30D158">100% ENCRYPTED</text>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#1C1C1E"/>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#0071E3"/>
    </g>

    <!-- Vector 3: Verifiable Credentials Status -->
    <g transform="translate(0, 132)">
      <text x="0" y="0" class="hud-bar-label">W3C Credential Signatures</text>
      <text x="350" y="0" text-anchor="end" class="hud-mono" fill="#BF5AF2">JCS VALIDATED</text>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#1C1C1E"/>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#AF52DE"/>
    </g>

    <!-- Vector 4: On-Chain Revocation Sync -->
    <g transform="translate(0, 172)">
      <text x="0" y="0" class="hud-bar-label">EVM Revocation Registry Sync</text>
      <text x="350" y="0" text-anchor="end" class="hud-mono" fill="#FF9F0A">SYNCHRONIZED</text>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#1C1C1E"/>
      <rect x="0" y="8" width="350" height="6" rx="3" fill="#FF9F0A"/>
    </g>
  </g>
</svg>
